<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litera AI - Asisten Literasi</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: oklch(97% 0.01 80);
    --chat-bg: oklch(100% 0 0);
    --text: oklch(20% 0.02 80);
    --primary: oklch(65% 0.15 70);
    --primary-hover: oklch(60% 0.15 70);
    --bubble-user: oklch(65% 0.15 70);
    --bubble-bot: oklch(94% 0.02 70);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background-color: var(--bg);
    display: flex;
    justify-content: center;
    height: 100vh;
    padding: 16px;
  }
  .chat-container {
    width: 100%;
    max-width: 800px;
    background: var(--chat-bg);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: var(--primary);
    color: white;
    padding: 20px;
    text-align: center;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 0.85rem; opacity: 0.9; }
  
  .chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #fafafa;
  }
  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  
  .message.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .message.bot p { margin-bottom: 8px; }
  .message.bot p:last-child { margin-bottom: 0; }
  .message.bot strong { font-weight: 600; }
  
  .input-area {
    display: flex;
    padding: 16px;
    background: var(--chat-bg);
    border-top: 1px solid #eee;
    gap: 10px;
  }
  input {
    flex: 1;
    padding: 14px 20px;
    border: 1px solid #ddd;
    border-radius: 30px;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s;
  }
  input:focus { border-color: var(--primary); }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 0 24px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Loading Dots */
  .typing-indicator { display: flex; gap: 4px; padding: 10px; }
  .typing-indicator span {
    width: 6px; height: 6px; background: #999; border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h1>📚 Litera AI</h1>
    <p>Asisten Literasi Cerdas (Kesehatan, Digital, Finansial, dll)</p>
  </div>
  
  <div class="chat-box" id="chatBox">
    <div class="message bot">
      Halo Boskuh! 👋 Aku <strong>Litera AI</strong>. Tanyain apa aja soal literasi: Kesehatan (PELITA), Digital, Finansial, Numerasi, atau Baca-Tulis! Mau mulai dari mana?
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ketik pertanyaanmu di sini..." onkeypress="handleKeyPress(event)">
    <button id="sendBtn" onclick="sendMessage()">Kirim</button>
  </div>
</div>

<script>
  // ⚠️ GANTI DENGAN API KEY BARU KAMU
  const API_KEY = "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"; 
  
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // System Prompt (Kepribadian AI)
  const SYSTEM_PROMPT = `Kamu adalah Litera AI, asisten literasi untuk pelajar Indonesia.
Fokus jawab: Kesehatan (termasuk game PELITA), Digital & Teknologi, Baca-Tulis, Numerasi, Finansial, dan Budaya.
Aturan:
1. Ramah, bahasa santai, tidak menggurui.
2. Tolak dengan sopan jika ditanya di luar topik literasi.
3. Untuk topik darurat kesehatan, arahkan ke 119 ext 8.
4. Maksimal 150 kata per jawaban. Gunakan format Markdown (bold, bullet) jika perlu.`;

  let chatHistory = [
    { role: "system", content: SYSTEM_PROMPT }
  ];

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    
    // Parse markdown untuk bot
    if (sender === 'bot') {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }
    
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typing';
    div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // Tampilkan pesan user
    addMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;
    showTyping();

    // Tambah ke history
    chatHistory.push({ role: "user", content: text });

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: chatHistory,
          temperature: 0.7,
          max_tokens: 500
        })
      });

      const data = await response.json();
      removeTyping();

      if (data.error) {
        addMessage(`❌ Error: ${data.error.message}`, 'bot');
      } else {
        const botReply = data.choices[0].message.content;
        addMessage(botReply, 'bot');
        // Simpan balasan bot ke history
        chatHistory.push({ role: "assistant", content: botReply });
      }
    } catch (error) {
      removeTyping();
      addMessage("❌ Waduh, koneksi ke server AI terputus. Cek internet atau API Key kamu.", 'bot');
      console.error(error);
    }

    sendBtn.disabled = false;
    userInput.focus();
  }
</script>

</body>
</html>
