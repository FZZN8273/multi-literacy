<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litera AI - Asisten Literasi Cerdas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // =====================================================================
        // ⚠️ GANTI DENGAN FIREBASE CONFIG KAMU (Ambil di Firebase Console)
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDqCdCWxA3QPCakZj1798NpTjXPSMSLWaI",
            authDomain: "log15-5b225.firebaseapp.com",
            projectId: "log15-5b225",
            storageBucket: "log15-5b225.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // =====================================================================
        // ⚠️ GANTI DENGAN GROQ API KEY KAMU
        // =====================================================================
        const GROQ_API_KEY = "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"; 
        const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";

        // --- ELEMEN HTML ---
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userNameDisplay = document.getElementById('userName');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        let currentUser = null;
        let chatHistory = [];

        // --- LOGIKA LOGIN ---
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("Gagal login: " + error.message);
            });
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                userNameDisplay.textContent = user.displayName || "Pelajar";
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                chatScreen.classList.add('hidden');
            }
        });

        // --- LOGIKA CHAT AI ---
        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`;
            div.innerHTML = `
                <div class="max-w-[80%] p-3 rounded-xl text-sm ${
                    isUser 
                    ? 'bg-emerald-600 text-white rounded-br-none' 
                    : 'bg-gray-800 text-gray-200 border border-gray-700 rounded-bl-none'
                }">
                    ${text.replace(/\n/g, '<br>')}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Tampilkan pesan user
            addMessage(text, true);
            userInput.value = '';
            
            // Matikan input sementara
            userInput.disabled = true;
            sendBtn.disabled = true;
            loadingIndicator.classList.remove('hidden');

            try {
                const messages = [
                    { 
                        role: 'system', 
                        content: `Kamu adalah Litera AI, asisten literasi cerdas untuk pelajar Indonesia. 
                        Fokus jawablah pada 6 literasi: Kesehatan, Digital, Baca-Tulis, Numerasi, Finansial, dan Budaya.
                        Gunakan bahasa Indonesia yang santai, ramah, dan mudah dipahami. 
                        Maksimal 100 kata per jawaban.` 
                    },
                    ...chatHistory,
                    { role: 'user', content: text }
                ];

                const response = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                      "model: "openai/gpt-oss-120b",
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Gagal terhubung ke AI");
                }

                const data = await response.json();
                const botReply = data.choices[0].message.content;

                // Simpan ke history
                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: botReply });

                // Tampilkan balasan AI
                addMessage(botReply, false);

            } catch (error) {
                addMessage(`❌ Error: ${error.message}`, false);
            } finally {
                // Nyalakan input kembali
                userInput.disabled = false;
                sendBtn.disabled = false;
                loadingIndicator.classList.add('hidden');
                userInput.focus();
            }
        }

        // Event Listener untuk Kirim
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col font-sans">

    <!-- ================= HALAMAN LOGIN ================= -->
    <div id="loginScreen" class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="text-center mb-8">
            <h1 class="text-5xl font-bold text-emerald-400 mb-2">Litera AI</h1>
            <p class="text-gray-400">Asisten Literasi Cerdas untuk Pelajar Indonesia</p>
        </div>
        <button id="loginBtn" class="bg-white text-gray-900 font-semibold py-3 px-6 rounded-lg flex items-center gap-3 hover:bg-gray-100 transition">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-6 h-6">
            Login dengan Google
        </button>
    </div>

    <!-- ================= HALAMAN CHAT ================= -->
    <div id="chatScreen" class="hidden flex-1 flex flex-col h-full bg-gray-900">
        <!-- Header -->
        <header class="bg-gray-950 p-4 border-b border-gray-800 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center font-bold text-xl">L</div>
                <div>
                    <h2 class="font-bold text-lg">Litera AI</h2>
                    <p class="text-xs text-gray-400">Halo, <span id="userName" class="text-emerald-400">User</span>!</p>
                </div>
            </div>
            <button id="logoutBtn" class="text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-md transition">Keluar</button>
        </header>

        <!-- Area Chat -->
        <main id="chatBox" class="flex-1 overflow-y-auto p-4 flex flex-col">
            <!-- Pesan Pembuka -->
            <div class="flex justify-start mb-4">
                <div class="max-w-[80%] p-3 rounded-xl text-sm bg-gray-800 text-gray-200 border border-gray-700 rounded-bl-none">
                    Halo! Aku Litera AI. Kamu bisa tanya aku soal literasi kesehatan, digital, finansial, atau baca-tulis. Mau mulai dari mana? 😊
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="bg-gray-950 p-4 border-t border-gray-800">
            <div id="loadingIndicator" class="hidden text-emerald-400 text-sm mb-2 animate-pulse">
                Litera AI sedang mengetik...
            </div>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Tanya apa aja soal literasi..." 
                    class="flex-1 bg-gray-800 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
                <button 
                    id="sendBtn" 
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-lg transition disabled:opacity-50"
                >
                    Kirim
                </button>
            </div>
        </footer>
    </div>

</body>
</html>
