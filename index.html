<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litera AI - Platform Literasi</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* [CSS TETAP SAMA SEPERTI SEBELUMNYA, GUE RINGKAS DI SINI BIAR GAK KEPANJANGAN] */
  :root { --bg: oklch(97% 0.01 80); --text: oklch(20% 0.02 80); --primary: oklch(55% 0.15 155); --danger: oklch(60% 0.18 30); }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center; }
  .app-container { width: 100%; max-width: 900px; height: 90vh; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
  
  /* GUEST CHAT SECTION */
  #chatSection { display: flex; flex-direction: column; height: 100%; }
  .header { background: var(--primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
  .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #fafafa; }
  .message { max-width: 80%; padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; }
  .message.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
  .message.bot { align-self: flex-start; background: #e8f5e9; color: var(--text); border-bottom-left-radius: 4px; }
  .input-area { display: flex; padding: 16px; background: white; border-top: 1px solid #eee; gap: 10px; }
  input { flex: 1; padding: 14px 20px; border: 1px solid #ddd; border-radius: 30px; outline: none; }
  button.send-btn { background: var(--primary); color: white; border: none; padding: 0 24px; border-radius: 30px; font-weight: bold; cursor: pointer; }
  
  /* MODAL LOGIN (MUNCUL KALAU LIMIT HABIS) */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
  .modal-box { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; }
  .btn-google { background: white; border: 2px solid #ddd; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 20px auto 0; }
</style>
</head>
<body>

<div class="app-container">
  <!-- BAGIAN CHAT (Bisa diakses tanpa login dulu) -->
  <div id="chatSection">
    <div class="header">
      <h2>📚 Litera AI <span id="userStatus" style="font-size:12px; font-weight:normal; background:rgba(255,255,255,0.2); padding:4px 8px; border-radius:10px;">Mode Tamu</span></h2>
      <div class="user-info">
        <button id="loginHeaderBtn" style="background:white; color:var(--primary); border:none; padding:8px 16px; border-radius:20px; font-weight:bold; cursor:pointer;">Login</button>
      </div>
    </div>
    
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Halo! 👋 Aku <strong>Litera AI</strong>. Sebagai tamu, kamu punya <strong>3 kesempatan bertanya</strong>. Ayo mulai diskusi literasi!
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ketik pertanyaanmu..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Kirim</button>
    </div>
  </div>
</div>

<!-- MODAL LOGIN -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <h2>Batas Tamu Habis 🛑</h2>
    <p style="margin-top:10px; color:#666;">Login dengan Google untuk lanjut bertanya, menyimpan streak, dan mengakses materi logika.</p>
    <button class="btn-google" id="loginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
      Login dengan Google
    </button>
    <p id="loginError" style="color: red; margin-top: 10px; font-size: 0.8rem;"></p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // ⚠️ GANTI DENGAN API KEY FIREBASE YANG VALID DARI CONSOLE LU!
  const firebaseConfig = {
    apiKey: "MASUKKAN_API_KEY_FIREBASE_LO_DI_SINI",
    authDomain: "log15-5b225.firebaseapp.com",
    projectId: "log15-5b225",
    // ...
  };

  const GROQ_API_KEY = "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";
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // STATE
  let isGuest = true;
  let guestChatCount = parseInt(localStorage.getItem('litera_guest_count') || '0');
  const GUEST_LIMIT = 3;

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const loginModal = document.getElementById('loginModal');
  const userStatus = document.getElementById('userStatus');

  // Cek limit saat load
  checkGuestLimit();

  function checkGuestLimit() {
    if (isGuest && guestChatCount >= GUEST_LIMIT) {
      userInput.disabled = true;
      sendBtn.disabled = true;
      userInput.placeholder = "Batas tamu habis. Silakan login.";
      loginModal.style.display = 'flex';
    }
  }

  // LOGIN LOGIC
  document.getElementById('loginBtn').addEventListener('click', async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      document.getElementById('loginError').innerText = "Gagal: " + error.code;
    }
  });
  
  document.getElementById('loginHeaderBtn').addEventListener('click', () => {
      loginModal.style.display = 'flex';
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      isGuest = false;
      loginModal.style.display = 'none';
      userStatus.innerText = "Member";
      userStatus.style.background = "rgba(255,255,255,0.4)";
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.placeholder = "Ketik pertanyaanmu...";
      document.getElementById('loginHeaderBtn').style.display = 'none';
      
      // Hapus jejak tamu
      localStorage.removeItem('litera_guest_count');
    } else {
      isGuest = true;
    }
  });

  // CHAT LOGIC
  const SYSTEM_PROMPT = `Kamu adalah Litera AI, asisten literasi & logika untuk pelajar Indonesia. Fokus jawab: Literasi, Logika, Filsafat Dasar, Retorika, Digital, Kesehatan, Finansial. Ramah dan maksimal 150 kata.`;
  let chatHistory = [{ role: "system", content: SYSTEM_PROMPT }];

  window.handleKeyPress = function(e) { if (e.key === 'Enter') window.sendMessage(); };

  window.sendMessage = async function() {
    const text = userInput.value.trim();
    if (!text) return;

    if (isGuest && guestChatCount >= GUEST_LIMIT) {
        loginModal.style.display = 'flex';
        return;
    }

    addMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;
    showTyping();
    chatHistory.push({ role: "user", content: text });

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: chatHistory, temperature: 0.7 })
      });

      const data = await response.json();
      const typing = document.getElementById('typing');
      if (typing) typing.remove();

      if (data.error) {
        addMessage(`❌ Error API: ${data.error.message}`, 'bot');
      } else {
        const botReply = data.choices[0].message.content;
        addMessage(botReply, 'bot');
        chatHistory.push({ role: "assistant", content: botReply });

        // UPDATE LIMIT TAMU
        if (isGuest) {
            guestChatCount++;
            localStorage.setItem('litera_guest_count', guestChatCount);
            checkGuestLimit();
        }
      }
    } catch (error) {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
      addMessage("❌ Koneksi terputus.", 'bot');
    } finally {
      if(!isGuest || guestChatCount < GUEST_LIMIT) {
          sendBtn.disabled = false;
          userInput.focus();
      }
    }
  };

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    if (sender === 'bot') div.innerHTML = marked.parse(text);
    else div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot'; div.id = 'typing';
    div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>
</body>
</html>
